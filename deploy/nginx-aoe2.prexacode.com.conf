# Config nginx del sitio aoe2.prexacode.com
# Ubicación en el servidor: /etc/nginx/sites-available/aoe2.prexacode.com
#   (con symlink en /etc/nginx/sites-enabled/)
#
# La API key NO está acá: se incluye desde /etc/nginx/aoe2-secret.conf
# (ver aoe2-secret.conf.example), que tiene chmod 600 y nunca se sirve a la web.
#
# Los bloques "managed by Certbot" (443 + redirect 80->443) los agrega certbot
# automáticamente al correr:  certbot --nginx -d aoe2.prexacode.com
#
# NOTA: la línea "# AI-DISABLED" (return 503) está presente cuando el asistente
# se desactiva temporalmente. Ver enable-ai.sh / disable-ai.sh.

server {
    server_name aoe2.prexacode.com;
    root /var/www/aoe2;
    index index.html;

    # Proxy al API de Anthropic. La key se agrega del lado del servidor (oculta).
    location = /api/anthropic {
        # return 503 '{"error":{"message":"El asistente IA esta desactivado temporalmente"}}'; # AI-DISABLED
        if ($request_method = OPTIONS) { add_header Access-Control-Allow-Origin "*"; add_header Access-Control-Allow-Methods "POST, OPTIONS"; add_header Access-Control-Allow-Headers "content-type"; add_header Access-Control-Max-Age 86400; return 204; }
        add_header Access-Control-Allow-Origin "*" always;
        limit_req zone=aoe2anthropic burst=10 nodelay;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $anthropic_host "api.anthropic.com";
        proxy_pass https://$anthropic_host/v1/messages;
        proxy_ssl_server_name on;
        proxy_set_header Host api.anthropic.com;
        proxy_set_header Content-Type "application/json";
        proxy_set_header anthropic-version "2023-06-01";
        include /etc/nginx/aoe2-secret.conf;          # proxy_set_header x-api-key "...";
        proxy_set_header Origin "";                    # evita que Anthropic lo trate como request de navegador
        proxy_set_header anthropic-dangerous-direct-browser-access "true";
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }

    location / { try_files $uri $uri/ =404; }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_types text/css application/javascript text/html application/json;
    gzip_min_length 1000;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aoe2.prexacode.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aoe2.prexacode.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = aoe2.prexacode.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name aoe2.prexacode.com;
    return 404; # managed by Certbot
}
